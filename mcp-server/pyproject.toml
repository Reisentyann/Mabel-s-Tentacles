[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-server"
version = "0.1.0"
description = "MCP Server for QQ Agent"
authors = [
    { name = "Author", email = "author@example.com" }
]
dependencies = [
    "mcp>=1.0.0",
    "asyncpg>=0.29.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
]
requires-python = ">=3.10"

[tool.hatch.build.targets.wheel]
packages = ["src"]
