version: "3.8"

# 生产启动（配置走 .env.production，真实凭据不入库）：
#   cp .env.production.example .env.production  → 填真实值 →
#   docker compose --env-file .env.production up -d --build
# 不带 --env-file 时读根目录 .env（若存在）；两者都无则用下方默认值（开发口径，
# 启动日志会 WARN 提醒——生产看到 WARN 必须回来配好）。

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: agent_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-agent_db}
    ports:
      - "127.0.0.1:54322:5432" # Bind to localhost to prevent direct external access
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-agent_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: . # 仓库根：后端依赖同级 describer-go 模块（go.mod replace ../describer-go）
      dockerfile: mcp-server-go/Dockerfile
    container_name: agent_backend
    restart: always
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-agent_db}
      - MCP_PORT=8080
      - MCP_BASE_URL=http://agent_backend:8080
      - SECRET_KEY=${JWT_SECRET:-supersecretkey}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - MCP_API_KEY=${MCP_API_KEY:-} # MCP master key：空 = 通道无鉴权放行（开发口径），生产必配
      - ACCESS_TOKEN=${ACCESS_TOKEN:-}
      - DOWNLOAD_BASE_URL=${DOWNLOAD_BASE_URL:-}
    ports:
      - "127.0.0.1:18001:8080" # MCP SSE：仅绑定 localhost，供同机 AstrBot 访问（不出公网）
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: agent_frontend
    restart: always
    ports:
      - "18080:80" # Use custom port on host to avoid conflict
    depends_on:
      - backend

volumes:
  postgres_data:
